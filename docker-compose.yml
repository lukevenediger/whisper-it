services:
  whisper-it:
    build:
      context: .
      args:
        COMMIT_HASH: ${COMMIT_HASH:-dev}
    ports:
      - "4000:4000"
    volumes:
      - whisper-models:/models
      - whisper-data:/data
      # Debug-only: expose test audio fixtures so the UI can pick one with a button.
      # Mount is harmless when WHISPER_DEBUG_FIXTURES=0 (default).
      - ./tests/fixtures/audio:/fixtures:ro
    environment:
      # OpenRouter key for cloud speaker attribution. Optional — users can also bring their own key in-browser.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Debug fixtures dropdown — set to 1 to expose tests/fixtures/audio/* in the UI.
      WHISPER_DEBUG_FIXTURES: ${WHISPER_DEBUG_FIXTURES:-0}
      # WhatsApp transcription via WAHA. Leave WAHA_BASE_URL unset to disable the feature.
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      # Reserved for phase-2 webhook signature verification (not enforced yet).
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    depends_on:
      - waha
    # Memory budget — base/small + chunking fit easily; bump if running medium/large-v3 on long audio.
    # If your Docker Desktop VM has < 8 GB allocated overall, raise it in Settings → Resources.
    mem_limit: 8g
    mem_reservation: 2g
    restart: unless-stopped

  # WhatsApp HTTP API gateway (https://waha.devlike.pro). WAHA Core (free).
  # Not published to the host — only whisper-it talks to it over the compose network,
  # proxying the QR/status so the API key never reaches the browser.
  waha:
    image: devlikeapro/waha
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      # Deliver inbound messages to whisper-it's webhook over the compose network.
      WHATSAPP_HOOK_URL: http://whisper-it:4000/api/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message
      # NOWEB engine: no headless Chromium → ~300 MB instead of ~1-2 GB (WEBJS).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Dashboard is reachable only inside the compose network; default creds are fine.
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-waha}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-waha}
    volumes:
      # NOWEB stores its SQLite session here — persist it so you don't re-scan the QR on restart.
      - waha-sessions:/app/.sessions
    mem_limit: 2g
    restart: unless-stopped

volumes:
  whisper-models:
  whisper-data:
  waha-sessions:
